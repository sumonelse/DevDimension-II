<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>OG card source</title>
        <!--
            Source for `public/og-image.png` (1200x630).

            Rendered with a headless browser rather than an image library so the
            card can use real typography and gradients:

                npx playwright screenshot --viewport-size=1200,630 \
                    file://scripts/og-image.html og-image.png

            `scripts/og-image.html` is the canonical source; the PNG is committed
            so no build step is needed to serve it.
        -->
        <style>
            :root {
                --purple: #7c3aed;
                --pink: #ec4899;
                --cyan: #06b6d4;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                width: 1200px;
                height: 630px;
                overflow: hidden;
                background: #0a0a14;
                font-family: "Space Grotesk", "Poppins", "Segoe UI", system-ui,
                    -apple-system, sans-serif;
                color: #fff;
                position: relative;
            }

            /* Ambient glows, echoing the hero background. */
            .glow {
                position: absolute;
                border-radius: 50%;
                filter: blur(90px);
                opacity: 0.55;
            }

            .g1 {
                width: 620px;
                height: 620px;
                background: var(--purple);
                top: -220px;
                left: -140px;
            }

            .g2 {
                width: 520px;
                height: 520px;
                background: var(--pink);
                bottom: -240px;
                right: -80px;
            }

            .g3 {
                width: 420px;
                height: 420px;
                background: var(--cyan);
                top: 180px;
                right: 220px;
                opacity: 0.28;
            }

            /* Faint technical grid, for texture. */
            .grid {
                position: absolute;
                inset: 0;
                background-image: linear-gradient(
                        rgba(255, 255, 255, 0.035) 1px,
                        transparent 1px
                    ),
                    linear-gradient(
                        90deg,
                        rgba(255, 255, 255, 0.035) 1px,
                        transparent 1px
                    );
                background-size: 60px 60px;
                mask-image: radial-gradient(
                    ellipse at 30% 40%,
                    #000 0%,
                    transparent 75%
                );
            }

            .content {
                position: relative;
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 0 80px;
                max-width: 820px;
            }

            .eyebrow {
                display: flex;
                align-items: center;
                gap: 18px;
                margin-bottom: 26px;
            }

            .mark {
                width: 58px;
                height: 58px;
                border-radius: 16px;
                background: linear-gradient(135deg, var(--purple), var(--pink));
                display: grid;
                place-items: center;
                font-weight: 700;
                font-size: 30px;
                letter-spacing: -2px;
                flex: none;
            }

            .eyebrow span {
                font-size: 21px;
                font-weight: 600;
                letter-spacing: 7px;
                color: rgba(255, 255, 255, 0.82);
            }

            h1 {
                font-size: 86px;
                line-height: 1.02;
                font-weight: 700;
                letter-spacing: -3px;
                margin-bottom: 26px;
            }

            h1 em {
                font-style: normal;
                background: linear-gradient(90deg, var(--pink), var(--purple));
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }

            p {
                font-size: 27px;
                line-height: 1.45;
                color: rgba(255, 255, 255, 0.7);
                max-width: 700px;
            }

            .tags {
                display: flex;
                gap: 12px;
                margin-top: 34px;
                flex-wrap: wrap;
            }

            .tag {
                font-size: 19px;
                font-weight: 500;
                padding: 9px 20px;
                border-radius: 999px;
                border: 1px solid rgba(255, 255, 255, 0.18);
                background: rgba(255, 255, 255, 0.06);
                color: rgba(255, 255, 255, 0.88);
            }

            .url {
                position: absolute;
                left: 80px;
                bottom: 42px;
                font-size: 22px;
                color: rgba(255, 255, 255, 0.5);
                letter-spacing: 1px;
            }

            /* A rotating wireframe prism on the right, built entirely from CSS
               3D transforms - no WebGL, no images. */
            .scene {
                position: absolute;
                right: 90px;
                top: 50%;
                transform: translateY(-50%) perspective(900px) rotateX(-18deg)
                    rotateY(28deg);
                transform-style: preserve-3d;
                animation: spin 26s linear infinite;
            }

            @keyframes spin {
                from {
                    transform: translateY(-50%) perspective(900px) rotateX(-18deg)
                        rotateY(28deg);
                }
                to {
                    transform: translateY(-50%) perspective(900px) rotateX(-18deg)
                        rotateY(388deg);
                }
            }

            .face {
                position: absolute;
                border: 2px solid rgba(255, 255, 255, 0.55);
                box-shadow: 0 0 24px rgba(124, 58, 237, 0.45) inset,
                    0 0 26px rgba(236, 72, 153, 0.22);
            }

            .f1 { width: 250px; height: 250px; transform: translateZ(125px); }
            .f2 { width: 250px; height: 250px; transform: rotateY(90deg) translateZ(125px); }
            .f3 { width: 250px; height: 250px; transform: rotateX(90deg) translateZ(125px); }
            .f4 { width: 250px; height: 250px; transform: rotateY(180deg) translateZ(125px); }
            .f5 { width: 250px; height: 250px; transform: rotateX(-90deg) translateZ(125px); }
            .f6 { width: 250px; height: 250px; transform: translateZ(-125px); }

            .core {
                width: 130px;
                height: 130px;
                transform: rotateX(45deg) rotateZ(45deg) translateZ(0);
                border-color: rgba(236, 72, 153, 0.85);
                box-shadow: 0 0 40px rgba(236, 72, 153, 0.5) inset;
            }
        </style>
    </head>
    <body>
        <div class="glow g1"></div>
        <div class="glow g2"></div>
        <div class="glow g3"></div>
        <div class="grid"></div>

        <div class="scene">
            <div class="face f1"></div>
            <div class="face f2"></div>
            <div class="face f3"></div>
            <div class="face f4"></div>
            <div class="face f5"></div>
            <div class="face f6"></div>
            <div class="face core"></div>
        </div>

        <div class="content">
            <div class="eyebrow">
                <div class="mark">&lt;/&gt;</div>
                <span>SUMIT MAURYA</span>
            </div>

            <h1>Full-Stack<br /><em>Developer</em></h1>

            <p>
                I build exceptional digital experiences with a passion for
                competitive programming and algorithmic thinking.
            </p>

            <div class="tags">
                <div class="tag">React</div>
                <div class="tag">Node.js</div>
                <div class="tag">Algorithms</div>
                <div class="tag">Data Structures</div>
            </div>
        </div>

        <div class="url">sumitmaurya.dev</div>
    </body>
</html>
