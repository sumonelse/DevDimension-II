  <!-- Fonts
       Loaded without blocking the first paint: the request is started immediately
       but the stylesheet is only applied once it arrives, so a slow or unreachable
       font server can never delay first contentful paint. `display=swap` inside the
       query means text still renders in the fallback while the font loads. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&family=Comic+Neue:wght@400;700&family=Bangers&display=swap"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&family=Comic+Neue:wght@400;700&family=Bangers&display=swap">
  </noscript>

  <!-- Canonical URL -->

  <!-- App Manifest -->

  <!-- Note: stylesheet and script preloads for `/src/*` were removed. Those paths
       only exist in dev; a production build emits hashed files under /assets, so
       every one of those hints was a guaranteed 404. Vite injects the correct
       tags for the real hashed output. -->
