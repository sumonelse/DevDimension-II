<!-- Fonts
       Self-hosted, so `font-display: swap` is safe here.

       This used to link the Google Fonts CDN with `display=optional`, which
       eliminated layout shift (CLS 0.193 -> 0.010) but meant a first-time
       visitor on a slow connection never saw the real typography at all - the
       wrong trade for a portfolio whose impression is largely type.

       Self-hosting fixes both ends. The files are same-origin, so the four
       faces needed for the first screen are preloaded below and start
       downloading in parallel with the HTML rather than after a round trip to
       a third party. With `swap` they are normally in place before first paint,
       so there is no visible swap and therefore no shift to suppress.

       `scripts/fetch-fonts.mjs` regenerates `src/fonts.css` and
       `public/fonts/`. Only the latin subset is shipped. -->
  <!-- Only the faces used above the fold are preloaded. The hero heading is
       `font-heading` (Space Grotesk) at weight 700, and body copy is Poppins at
       400/600. Preloading faces the first screen does not use just moves ~29 kB
       ahead of the CSS and entry JS in the critical path. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
    href="/fonts/space-grotesk-700.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin
    href="/fonts/poppins-400.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin
    href="/fonts/poppins-600.woff2">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://sumitmaurya.dev/" />

  <!-- App Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- iOS Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sumit Maurya" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

  <!-- Note: stylesheet and script preloads for `/src/*` were removed. Those paths
       only exist in dev; a production build emits hashed files under /assets, so
       every one of those hints was a guaranteed 404. Vite injects the correct
       tags for the real hashed output. -->
